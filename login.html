<div class="card-container">
  <div class="card" id="card">
    
    <!-- CARA A: Presentación de la Clínica -->
    <div class="card-face card-front">
      <h2>DaVas Clínica Dental</h2>
      <p>Salud y estética para tu sonrisa</p>
      <button onclick="voltearTarjeta()">Ingresar al Portal</button>
    </div>
    
    <!-- CARA B: Formulario de Login -->
    <div class="card-face card-back">
      <h3>Iniciar Sesión</h3>
      <form id="login-form">
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
      </form>
      <button class="btn-back" onclick="voltearTarjeta()">Regresar</button>
    </div>

  </div>
</div>
