<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clínica DaVas</title>
    
    <!-- Enlace a tus estilos CSS (asegúrate de que la ruta sea correcta) -->
    <link rel="stylesheet" href="CSS/style.css">
    
    <!-- PASO 3: Aquí cargamos la librería de Supabase desde internet -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="card-container">
      <div class="card" id="card">
        
        <!-- CARA A: Presentación de la Clínica -->
        <div class="card-face card-front">
          <h2>DaVas Clínica Dental</h2>
          <p>Salud y estética para tu sonrisa</p>
          <button onclick="voltearTarjeta()">Ingresar al Portal</button>
        </div>
        
        <!-- CARA B: Formulario de Login -->
        <div class="card-face card-back">
          <h3>Iniciar Sesión</h3>
          <form id="login-form">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
          </form>
          <button class="btn-back" onclick="voltearTarjeta()">Regresar</button>
        </div>

      </div>
    </div>

    <!-- Enlace a tu JavaScript donde pondrás las llaves de Supabase -->
    <script src="js/app.js"></script>
</body>
</html>
