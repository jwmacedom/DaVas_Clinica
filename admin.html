<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Clínica DaVas</title>
    <link rel="stylesheet" href="CSS/style.css">
    <!-- Cargamos Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header style="padding: 20px; background: #007bff; color: white; display: flex; justify-content: space-between;">
        <h1>Panel de Administración (DaVas)</h1>
        <button onclick="cerrarSesion()" style="background: #333; color: white; border: none; padding: 10px; cursor: pointer;">Cerrar Sesión</button>
    </header>

    <main style="padding: 20px;">
        <h2>Control Global de Citas</h2>
        <p>Aquí puedes ver y gestionar las citas de todos tus pacientes.</p>
        <hr><br>

        <section style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="background: #f4f4f4; border-bottom: 2px solid #ddd;">
                        <th style="padding: 12px;">ID Paciente</th>
                        <th style="padding: 12px;">Fecha</th>
                        <th style="padding: 12px;">Hora</th>
                        <th style="padding: 12px;">Servicio</th>
                        <th style="padding: 12px;">Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-admin-citas">
                    <!-- Las citas se cargarán dinámicamente con JavaScript desde Supabase -->
                    <tr>
                        <td colspan="5" style="padding: 15px; text-align: center;">Cargando historial completo de citas...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Conectamos el script que manejará la lógica de esta página -->
    <script src="js/app.js"></script>
</body>
</html>
