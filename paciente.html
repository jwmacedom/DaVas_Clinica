<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Paciente - Clínica DaVas</title>
    <link rel="stylesheet" href="CSS/style.css">
    <!-- Cargamos Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header style="padding: 20px; background: #333; color: white; display: flex; justify-content: space-between;">
        <h1>Portal del Paciente</h1>
        <button onclick="cerrarSesion()" style="background: red; color: white; border: none; padding: 10px; cursor: pointer;">Cerrar Sesión</button>
    </header>

    <main style="padding: 20px; max-width: 800px; margin: 0 auto;">
        <h2>Bienvenido a tu portal dental</h2>
        <hr><br>

        <!-- Formulario para pedir cita -->
        <section style="background: #f4f4f4; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
            <h3>Agendar una nueva cita</h3>
            <form id="form-cita">
                <label>Fecha:</label><br>
                <input type="date" id="fecha-cita" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>
                
                <label>Hora:</label><br>
                <input type="time" id="hora-cita" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>
                
                <label>Especialidad / Servicio:</label><br>
                <select id="servicio-cita" style="width: 100%; padding: 8px; margin: 8px 0;">
                    <option value="Consulta General">Consulta General</option>
                    <option value="Limpieza Dental">Limpieza Dental</option>
                    <option value="Ortodoncia">Ortodoncia</option>
                    <option value="Blanqueamiento">Blanqueamiento</option>
                </select><br><br>
                
                <button type="submit" style="background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px;">Solicitar Cita</button>
            </form>
        </section>

        <!-- Listado de citas del paciente -->
        <section>
            <h3>Mis Citas Agendadas</h3>
            <div id="lista-citas">Cargando tus citas...</div>
        </section>
    </main>

    <!-- Conectamos el script que manejará la lógica de esta página -->
    <script src="js/app.js"></script>
</body>
</html>
